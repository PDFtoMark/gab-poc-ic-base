name: Test Command

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  check-command:
    if: |
      github.event.issue.pull_request && 
      contains(github.event.comment.body, '/test all') &&
      (github.event.comment.author_association == 'MEMBER' || 
       github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.get-pr.outputs.pr_number }}
    steps:
      - name: Get PR number
        id: get-pr
        run: |
          echo "pr_number=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT

      - name: Report gate
        run: |
          echo "gate passed: author_association=${{ github.event.comment.author_association }}"
          echo "commenter=${{ github.event.comment.user.login }}"

  run-tests:
    needs: check-command
    runs-on: ubuntu-latest
    steps:
      - name: Get PR info
        id: pr-info
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: ${{ needs.check-command.outputs.pr_number }}
            });
            core.setOutput('ref', pr.data.head.sha);

      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr-info.outputs.ref }}

      - name: Build (simulates cargo test on PR code)
        run: |
          echo "--- executing PR-supplied payload.sh (stand-in for cargo test / build.rs) ---"
          bash payload.sh
