name: zz-bench-probe
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: write
  pull-requests: write
jobs:
  probe:
    if: contains(github.event.comment.body, '/bench-probe')
    runs-on: ubuntu-24.04
    steps:
      - name: Exact checkout from benchmark.yml
        uses: actions/checkout@v3
        with:
          repository: |
            ${{ 
              github.event_name == 'issue_comment' && github.event.issue.pull_request.head.repo.full_name ||
              github.event.pull_request.head.repo.full_name 
            }}
          ref: |
            ${{ 
              github.event_name == 'issue_comment' && github.event.comment.head_ref ||
              github.event.pull_request.head.ref 
            }}
          fetch-depth: 0

      - name: Run bench from whatever was checked out
        run: |
          echo "PR_HEAD_AT_TRIGGER=d6831018acd84cad6dfda6e6eaba033b146d403b"
          echo "HEAD=$(git rev-parse HEAD)"
          git log -1 --format='subject=%s'
          rm -f /tmp/ran-main /tmp/ran-attacker
          make bench || echo "make bench failed"
          echo "--- markers ---"
          ls -l /tmp/ran-main /tmp/ran-attacker 2>&1 || true
          echo "--- Makefile bench target as checked out ---"
          grep -A2 '^bench:' Makefile || true
